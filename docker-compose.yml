services:
  migrate:
    build:
      context: .
      target: builder
    user: node
    environment:
      DATABASE_URL: file:/data/dev.db
    volumes:
      - api-data:/data
    command: yarn db:deploy

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: file:/data/dev.db
      JWT_SECRET: change_this_in_production
      LOG_LEVEL: info
    volumes:
      - api-data:/data
    restart: unless-stopped

volumes:
  api-data:
